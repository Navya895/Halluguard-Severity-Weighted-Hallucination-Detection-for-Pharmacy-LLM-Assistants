[project]
name = "halluguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "requests>=2.31",
    "numpy>=1.26",
    "transformers>=4.46",
    "accelerate>=1.1.0",
    "datasets>=3.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "sentence-transformers>=3.0",
    "spacy>=3.8,<3.9",
    "streamlit>=1.35",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true